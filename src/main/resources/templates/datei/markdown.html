<!DOCTYPE html>
<html lang="de" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-dark.css}" />
    <title th:text="${datei.titel}">Markdown</title>
</head>
<body class="d-flex flex-column min-vh-100">
<a class="skip-link" href="#main-content">Zum Inhalt</a>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/betreuer}"><i class="bi bi-mortarboard-fill"></i> ThesisIsComing</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Navigation umschalten">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/betreuer}"><i class="bi bi-person me-1"></i>Betreuer</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/themen}"><i class="bi bi-journal-text me-1"></i>Themen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/studierende}"><i class="bi bi-people me-1"></i>Studierende</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/matching}"><i class="bi bi-diagram-3 me-1"></i>Matching</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/rollen}"><i class="bi bi-shield-lock me-1"></i>Rollen</a></li>
            </ul>
            <div class="navbar-nav" sec:authorize="hasAnyRole('BETREUER','STUDIERENDE')">
                <a class="nav-link" th:href="@{/mein-profil}"><i class="bi bi-person-circle me-1"></i>Mein Profil</a>
            </div>
        </div>
    </div>
</nav>

<main id="main-content" class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card">
                <div class="card-header d-flex align-items-center">
                    <h1 class="h5 mb-0"><i class="bi bi-file-earmark-text me-2"></i><span th:text="${datei.titel}">Datei</span></h1>
                </div>
                <div class="card-body tic-prose" th:utext="${contentHtml}">Inhalt</div>
            </div>
        </div>
    </div>
</main>

<footer class="tic-footer">
    <div class="container text-center">
        <small>ThesisIsComing &copy; 2025</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
