<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${datei.titel})}">
    <title>Markdown</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card">
                <div class="card-header d-flex align-items-center">
                    <h1 class="h5 mb-0"><i class="bi bi-file-earmark-text me-2"></i><span th:text="${datei.titel}">Datei</span></h1>
                </div>
                <div class="card-body tic-prose" th:utext="${contentHtml}">Inhalt</div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
