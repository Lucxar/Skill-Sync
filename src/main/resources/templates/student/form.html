<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <title th:text="${pageTitle}">Studierende</title>
</head>
<body>
<a class="skip-link" href="#main-content">Zum Inhalt</a>
<main id="main-content">
    <section>
        <h1 th:text="${pageTitle}">Studierende</h1>
        <form th:action="${formAction}" th:object="${studentForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{version}" />
            <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{*}" role="alert" aria-live="polite">Fehler</p>
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" required
                       th:attr="aria-invalid=${#fields.hasErrors('name')}, aria-describedby=${#fields.hasErrors('name')} ? 'student-name-error' : null" />
                <p id="student-name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert" aria-live="polite">Fehler</p>
            </div>
            <div>
                <label for="email">E-Mail (optional)</label>
                <input type="email" id="email" th:field="*{email}" />
            </div>
            <div>
                <label for="matrikelnummer">Matrikelnummer (optional)</label>
                <input type="text" id="matrikelnummer" th:field="*{matrikelnummer}" />
            </div>
            <div>
                <label for="bestandeneKurse">Besuchte Veranstaltungen (eine pro Zeile oder mit Komma)</label>
                <textarea id="bestandeneKurse" th:field="*{bestandeneKurse}" rows="5"></textarea>
            </div>
            <div>
                <label for="interessensgebiete">Interessensgebiete (eine pro Zeile oder mit Komma)</label>
                <textarea id="interessensgebiete" th:field="*{interessensgebiete}" rows="4"></textarea>
            </div>
            <button type="submit" th:text="${submitLabel}">Speichern</button>
        </form>
        <a th:href="@{/studierende}">Zurueck zur Liste</a>
    </section>
</main>
</body>
</html>
