<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Studierendenliste')}">
    <title>Studierendenliste</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('studierende')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <div class="tic-page-header">
        <h1><i class="bi bi-people me-2"></i>Studierendenliste</h1>
        <div class="tic-actions" sec:authorize="hasAnyRole('ADMIN','STUDIERENDE')">
            <a class="btn btn-primary" th:href="@{/studierende/neu}"><i class="bi bi-plus-lg me-1"></i>Neues Profil anlegen</a>
        </div>
    </div>

    <!-- Student List -->
    <div class="card border-0">
        <div class="list-group list-group-flush" th:if="${students != null && !#lists.isEmpty(students)}">
            <a th:each="s : ${students}"
               th:href="@{/studierende/{id}(id=${s.id})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span><i class="bi bi-person me-2 text-secondary"></i><span th:text="${s.name}">Studierende</span></span>
                <i class="bi bi-chevron-right text-secondary"></i>
            </a>
        </div>
        <div th:if="${students == null || #lists.isEmpty(students)}" class="tic-empty-state">
            <i class="bi bi-inbox"></i>
            <p>Keine Studierenden vorhanden</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
