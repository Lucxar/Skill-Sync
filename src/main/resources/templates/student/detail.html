<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Studierendendetail')}">
    <title>Studierendendetail</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('studierende')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/studierende}">Studierende</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${student.name}">Detail</li>
        </ol>
    </nav>

    <!-- Page Header -->
    <div class="tic-page-header">
        <h1><i class="bi bi-person-fill me-2"></i><span th:text="${student.name}">Studierende</span></h1>
        <div class="tic-actions" sec:authorize="hasAnyRole('ADMIN','STUDIERENDE')">
            <a class="btn btn-outline-primary btn-sm" th:href="@{'/studierende/' + ${student.id} + '/bearbeiten'}"><i class="bi bi-pencil me-1"></i>Bearbeiten</a>
            <form th:action="@{'/studierende/' + ${student.id} + '/loeschen'}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Loeschen</button>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <!-- Kontakt Card -->
            <div class="card mb-4">
                <div class="card-header">
                    <h2 class="h5 mb-0"><i class="bi bi-person-vcard me-2"></i>Kontakt</h2>
                </div>
                <div class="card-body">
                    <div th:if="${student.kontaktinformationen != null}">
                        <div class="mb-2 d-flex align-items-center gap-2" th:if="${student.kontaktinformationen.email != null}">
                            <i class="bi bi-envelope text-secondary"></i>
                            <span th:text="${student.kontaktinformationen.email}">email</span>
                        </div>
                        <div class="d-flex align-items-center gap-2" th:if="${student.kontaktinformationen.matrikelnummer != null}">
                            <i class="bi bi-hash text-secondary"></i>
                            <span th:text="${student.kontaktinformationen.matrikelnummer}">matrikel</span>
                        </div>
                    </div>
                    <p th:if="${student.kontaktinformationen == null}" class="text-muted mb-0">Keine Kontaktinformationen</p>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <!-- Kurse Card -->
            <div class="card mb-4">
                <div class="card-header">
                    <h2 class="h5 mb-0"><i class="bi bi-book me-2"></i>Besuchte Veranstaltungen</h2>
                </div>
                <div class="card-body">
                    <div th:if="${student.bestandeneKurse != null && !#lists.isEmpty(student.bestandeneKurse)}">
                        <span th:each="k : ${student.bestandeneKurse}" class="tic-tag" th:text="${k.kursbezeichnung}">Kurs</span>
                    </div>
                    <p th:if="${student.bestandeneKurse == null || #lists.isEmpty(student.bestandeneKurse)}" class="text-muted mb-0">Keine Kurse eingetragen</p>
                </div>
            </div>

            <!-- Interessen Card -->
            <div class="card mb-4">
                <div class="card-header">
                    <h2 class="h5 mb-0"><i class="bi bi-star me-2"></i>Interessensgebiete</h2>
                </div>
                <div class="card-body">
                    <div th:if="${student.interessensgebiete != null && !#lists.isEmpty(student.interessensgebiete)}">
                        <span th:each="i : ${student.interessensgebiete}" class="tic-tag" th:text="${i.bezeichnung}">Fachgebiet</span>
                    </div>
                    <p th:if="${student.interessensgebiete == null || #lists.isEmpty(student.interessensgebiete)}" class="text-muted mb-0">Keine Interessen eingetragen</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" th:href="@{/studierende}"><i class="bi bi-arrow-left me-1"></i>Zurueck zur Liste</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
