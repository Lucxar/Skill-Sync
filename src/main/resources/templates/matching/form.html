<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matching</title>
</head>
<body>
<main>
    <section>
        <h1>Matching</h1>
        <p>Gib deine bestandenen Veranstaltungen und Interessensgebiete an, um passende Themen und Betreuer zu finden.</p>
        <p th:if="${matchingError != null}" th:text="${matchingError}">Bitte Angaben machen.</p>
        <form th:action="@{/matching}" method="post" th:object="${matchingForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label for="bestandeneKurse">Bestandene Kurse</label>
            <textarea id="bestandeneKurse" rows="5" th:field="*{bestandeneKurse}"></textarea>
            <label for="interessensgebiete">Interessensgebiete</label>
            <textarea id="interessensgebiete" rows="5" th:field="*{interessensgebiete}"></textarea>
            <button type="submit">Matching starten</button>
        </form>
    </section>
</main>
</body>
</html>
