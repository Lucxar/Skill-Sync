<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Matching-Ergebnisse')}">
    <title>Matching-Ergebnisse</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('matching')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <div class="tic-page-header">
        <h1><i class="bi bi-diagram-3 me-2"></i>Matching-Ergebnisse</h1>
        <div class="tic-actions">
            <a class="btn btn-outline-secondary" th:href="@{/matching}"><i class="bi bi-arrow-counterclockwise me-1"></i>Neue Suche</a>
        </div>
    </div>

    <div class="row g-4">
        <!-- Passende Themen -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2 class="h5 mb-0"><i class="bi bi-journal-text me-2"></i>Passende Themen</h2>
                    <span class="badge bg-primary" th:if="${themenMatches != null}" th:text="${#lists.size(themenMatches)}">0</span>
                </div>
                <div class="card-body" th:if="${themenMatches != null && !#lists.isEmpty(themenMatches)}">
                    <div th:each="match : ${themenMatches}" class="tic-match-card">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <a th:href="@{/themen/{id}(id=${match.thema.id})}" th:text="${match.thema.titel}" class="fw-semibold">Thema</a>
                            <span class="badge bg-primary" th:text="${match.score}">0</span>
                        </div>
                        <div class="tic-score mb-3">
                            <div class="progress">
                                <div class="progress-bar" th:style="'width:' + ${match.score} + '%'"></div>
                            </div>
                        </div>
                        <div class="mb-2" th:if="${!#lists.isEmpty(match.passendeFachgebiete)}">
                            <small class="text-muted d-block mb-1"><i class="bi bi-tags me-1"></i>Passende Fachgebiete</small>
                            <span th:each="fach : ${match.passendeFachgebiete}" class="tic-tag" style="font-size:0.75rem;" th:text="${fach}">Fachgebiet</span>
                        </div>
                        <div th:if="${!#lists.isEmpty(match.passendeKurse)}">
                            <small class="text-muted d-block mb-1"><i class="bi bi-book me-1"></i>Passende Kurse</small>
                            <span th:each="kurs : ${match.passendeKurse}" class="tic-tag" style="font-size:0.75rem;" th:text="${kurs}">Kurs</span>
                        </div>
                    </div>
                </div>
                <div th:if="${themenMatches == null || #lists.isEmpty(themenMatches)}" class="tic-empty-state">
                    <i class="bi bi-journal-x"></i>
                    <p>Keine passenden Themen gefunden.</p>
                </div>
            </div>
        </div>

        <!-- Passende Betreuer -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2 class="h5 mb-0"><i class="bi bi-person me-2"></i>Passende Betreuer</h2>
                    <span class="badge bg-primary" th:if="${betreuerMatches != null}" th:text="${#lists.size(betreuerMatches)}">0</span>
                </div>
                <div class="card-body" th:if="${betreuerMatches != null && !#lists.isEmpty(betreuerMatches)}">
                    <div th:each="match : ${betreuerMatches}" class="tic-match-card">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <a th:href="@{/betreuer/{id}(id=${match.betreuer.id})}" th:text="${match.betreuer.name}" class="fw-semibold">Betreuer</a>
                            <span class="badge bg-primary" th:text="${match.score}">0</span>
                        </div>
                        <div class="tic-score mb-3">
                            <div class="progress">
                                <div class="progress-bar" th:style="'width:' + ${match.score} + '%'"></div>
                            </div>
                        </div>
                        <div th:if="${!#lists.isEmpty(match.passendeFachgebiete)}">
                            <small class="text-muted d-block mb-1"><i class="bi bi-tags me-1"></i>Passende Fachgebiete</small>
                            <span th:each="fach : ${match.passendeFachgebiete}" class="tic-tag" style="font-size:0.75rem;" th:text="${fach}">Fachgebiet</span>
                        </div>
                    </div>
                </div>
                <div th:if="${betreuerMatches == null || #lists.isEmpty(betreuerMatches)}" class="tic-empty-state">
                    <i class="bi bi-person-x"></i>
                    <p>Keine passenden Betreuer gefunden.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
