<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <title>Betreuer</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('betreuer')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/betreuer}">Betreuer</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${pageTitle}">Formular</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header d-flex align-items-center">
                    <h1 class="h5 mb-0"><i class="bi bi-person me-2"></i><span th:text="${pageTitle}">Betreuer</span></h1>
                </div>
                <div class="card-body">
                    <form th:action="${formAction}" th:object="${betreuerForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" th:field="*{version}" />

                        <!-- Global Errors -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger d-flex align-items-center mb-3" role="alert" aria-live="polite">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:errors="*{*}">Fehler</span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   th:attr="aria-invalid=${#fields.hasErrors('name')}, aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null" />
                            <div id="name-error" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert" aria-live="polite">Fehler</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">E-Mail <span class="text-muted">(optional)</span></label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="matrikelnummer">Matrikelnummer <span class="text-muted">(optional)</span></label>
                            <input type="text" class="form-control" id="matrikelnummer" th:field="*{matrikelnummer}" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="fachgebiete">Fachgebiete / Tags</label>
                            <textarea class="form-control" id="fachgebiete" th:field="*{fachgebiete}" rows="4"></textarea>
                            <div class="form-text">Komma oder Zeilenumbrueche als Trennung verwenden.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i><span th:text="${submitLabel}">Speichern</span></button>
                            <a class="btn btn-outline-secondary" th:href="@{/betreuer}"><i class="bi bi-arrow-left me-1"></i>Zurueck zur Liste</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
