<!DOCTYPE html>
<html lang="de" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-dark.css}" />
    <title>Betreuerliste</title>
</head>
<body class="d-flex flex-column min-vh-100">
<a class="skip-link" href="#main-content">Zum Inhalt</a>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/betreuer}"><i class="bi bi-mortarboard-fill"></i> ThesisIsComing</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Navigation umschalten">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/betreuer}"><i class="bi bi-person me-1"></i>Betreuer</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/themen}"><i class="bi bi-journal-text me-1"></i>Themen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/studierende}"><i class="bi bi-people me-1"></i>Studierende</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/matching}"><i class="bi bi-diagram-3 me-1"></i>Matching</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/rollen}"><i class="bi bi-shield-lock me-1"></i>Rollen</a></li>
            </ul>
            <div class="navbar-nav" sec:authorize="hasAnyRole('BETREUER','STUDIERENDE')">
                <a class="nav-link" th:href="@{/mein-profil}"><i class="bi bi-person-circle me-1"></i>Mein Profil</a>
            </div>
        </div>
    </div>
</nav>

<main id="main-content" class="container py-4 flex-grow-1">
    <!-- Page Header -->
    <div class="tic-page-header">
        <h1><i class="bi bi-person me-2"></i>Betreuerliste</h1>
        <div class="tic-actions">
            <div sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/rollen}"><i class="bi bi-shield-lock me-1"></i>Rollen verwalten</a>
            </div>
            <div sec:authorize="hasAnyRole('ADMIN','BETREUER','ORGANISATOR')">
                <a class="btn btn-primary" th:href="@{/betreuer/neu}"><i class="bi bi-plus-lg me-1"></i>Neuen Betreuer anlegen</a>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="card border-0 mb-4">
        <div class="card-body">
            <form class="row g-3 align-items-end" th:action="@{/betreuer}" method="get" th:object="${sucheForm}">
                <div class="col-md-4">
                    <label class="form-label" for="suchbegriff"><i class="bi bi-search me-1"></i>Suche</label>
                    <input id="suchbegriff" type="text" class="form-control" th:field="*{suchbegriff}" placeholder="Name oder Stichwort..." />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="fachgebiet"><i class="bi bi-tag me-1"></i>Fachgebiet</label>
                    <input id="fachgebiet" type="text" class="form-control" th:field="*{fachgebiet}" placeholder="z.B. Informatik..." />
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-funnel me-1"></i>Filtern</button>
                    <a class="btn btn-outline-secondary" th:href="@{/betreuer}"><i class="bi bi-arrow-counterclockwise me-1"></i>Zurücksetzen</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Betreuer List -->
    <div class="card border-0">
        <div class="list-group list-group-flush" th:if="${betreuer != null && !#lists.isEmpty(betreuer)}">
            <a th:each="b : ${betreuer}"
               th:href="@{/betreuer/{id}(id=${b.id})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span><i class="bi bi-person me-2 text-secondary"></i><span th:text="${b.name}">Betreuer</span></span>
                <i class="bi bi-chevron-right text-secondary"></i>
            </a>
        </div>
        <div th:if="${betreuer == null || #lists.isEmpty(betreuer)}" class="tic-empty-state">
            <i class="bi bi-inbox"></i>
            <p>Keine Betreuer vorhanden</p>
        </div>
    </div>
</main>

<footer class="tic-footer">
    <div class="container text-center">
        <small>ThesisIsComing &copy; 2025</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
