<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Betreuerliste</title>
</head>
<body>
<main>
    <section>
        <h1>Betreuerliste</h1>
        <ul>
            <li th:each="b : ${betreuer}">
                <a th:href="@{/betreuer/{id}(id=${b.id})}" th:text="${b.name}">Betreuer</a>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
