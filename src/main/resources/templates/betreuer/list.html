<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <title>Betreuerliste</title>
</head>
<body>
<a class="skip-link" href="#main-content">Zum Inhalt</a>
<main id="main-content">
    <section>
        <h1>Betreuerliste</h1>
        <div sec:authorize="hasAnyRole('BETREUER','STUDIERENDE')">
            <a th:href="@{/mein-profil}">Mein Profil</a>
        </div>
        <form th:action="@{/betreuer}" method="get" th:object="${sucheForm}">
            <label for="suchbegriff">Suche</label>
            <input id="suchbegriff" type="text" th:field="*{suchbegriff}" />
            <label for="fachgebiet">Fachgebiet</label>
            <input id="fachgebiet" type="text" th:field="*{fachgebiet}" />
            <button type="submit">Anwenden</button>
            <a th:href="@{/betreuer}">Zuruecksetzen</a>
        </form>
        <div sec:authorize="hasAnyRole('ADMIN','BETREUER','ORGANISATOR')">
            <a th:href="@{/betreuer/neu}">Neuen Betreuer anlegen</a>
        </div>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/rollen}">Rollen verwalten</a>
        </div>
        <ul>
            <li th:each="b : ${betreuer}">
                <a th:href="@{/betreuer/{id}(id=${b.id})}" th:text="${b.name}">Betreuer</a>
            </li>
        </ul>
        <p th:if="${betreuer == null || #lists.isEmpty(betreuer)}">Keine Betreuer vorhanden</p>
    </section>
</main>
</body>
</html>
