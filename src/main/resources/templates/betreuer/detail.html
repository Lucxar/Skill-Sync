<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Betreuerdetail</title>
</head>
<body>
<main>
    <section>
        <h1 th:text="${betreuer.name}">Betreuer</h1>

        <div sec:authorize="hasAnyRole('ADMIN','BETREUER')">
            <a th:href="@{'/betreuer/' + ${betreuer.id} + '/bearbeiten'}">Betreuer bearbeiten</a>
            <form th:action="@{'/betreuer/' + ${betreuer.id} + '/loeschen'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit">Betreuer loeschen</button>
            </form>
        </div>

        <div>
            <h2>Kontakt</h2>
            <p th:if="${betreuer.kontaktinformationen != null}">
                <span th:text="${betreuer.kontaktinformationen.email}">email</span>
            </p>
            <p th:if="${betreuer.kontaktinformationen != null}">
                <span th:text="${betreuer.kontaktinformationen.matrikelnummer}">matrikel</span>
            </p>
            <p th:if="${betreuer.kontaktinformationen == null}">Keine Kontaktinformationen</p>
        </div>

        <div>
            <h2>Fachgebiete</h2>
            <ul>
                <li th:each="f : ${betreuer.fachgebiete}" th:text="${f.bezeichnung}">Fachgebiet</li>
            </ul>
        </div>

        <div>
            <h2>Links</h2>
            <p th:if="${linkError != null}" th:text="${linkError}">Fehler</p>
            <ul>
                <li th:each="l, iter : ${betreuer.links}">
                    <a th:href="${l.url}" th:text="${l.anzeigetext} ?: ${l.url}">Link</a>
                    <div sec:authorize="hasAnyRole('ADMIN','BETREUER')">
                        <form th:action="@{'/betreuer/' + ${betreuer.id} + '/links/update'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="oldUrl" th:value="${l.url}" />
                            <input type="hidden" name="oldAnzeigetext" th:value="${l.anzeigetext}" />
                            <label th:for="${'link-url-' + iter.index}">URL</label>
                            <input type="url" th:id="${'link-url-' + iter.index}" name="url" th:value="${l.url}" required />
                            <label th:for="${'link-text-' + iter.index}">Anzeigetext</label>
                            <input type="text" th:id="${'link-text-' + iter.index}" name="anzeigetext" th:value="${l.anzeigetext}" required />
                            <button type="submit">Aendern</button>
                        </form>
                        <form th:action="@{'/betreuer/' + ${betreuer.id} + '/links/delete'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="url" th:value="${l.url}" />
                            <input type="hidden" name="anzeigetext" th:value="${l.anzeigetext}" />
                            <button type="submit">Loeschen</button>
                        </form>
                    </div>
                </li>
            </ul>
            <p th:if="${betreuer.links == null || #lists.isEmpty(betreuer.links)}">Keine Links</p>
            <div sec:authorize="hasAnyRole('ADMIN','BETREUER')">
                <h3>Link hinzufuegen</h3>
                <form th:action="@{'/betreuer/' + ${betreuer.id} + '/links'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <label for="new-link-url">URL</label>
                    <input type="url" id="new-link-url" name="url" required />
                    <label for="new-link-text">Anzeigetext</label>
                    <input type="text" id="new-link-text" name="anzeigetext" required />
                    <button type="submit">Hinzufuegen</button>
                </form>
            </div>
        </div>

        <div>
            <h2>Dateien</h2>
            <ul>
                <li th:each="d : ${betreuer.dateien}">
                    <span th:text="${d.titel}">Titel</span>
                </li>
            </ul>
        </div>

        <div>
            <h2>Themen</h2>
            <ul>
                <li th:each="t : ${themen}">
                    <span th:text="${t.titel}">Thema</span>
                </li>
            </ul>
        </div>

        <div sec:authorize="hasAnyRole('ADMIN','BETREUER')">
            <h2>Thema zuordnen</h2>
            <form th:action="@{'/betreuer/' + ${betreuer.id} + '/themen'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label for="themaId">Thema</label>
                <select id="themaId" name="themaId" required>
                    <option value="" disabled selected>Bitte waehlen</option>
                    <option th:each="t : ${allThemen}" th:value="${t.id}" th:text="${t.titel}">Thema</option>
                </select>
                <button type="submit">Zuordnen</button>
            </form>
            <p th:if="${allThemen == null || #lists.isEmpty(allThemen)}">Keine Themen verfuegbar</p>
        </div>
    </section>
</main>
</body>
</html>
