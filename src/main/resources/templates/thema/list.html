<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <title>Themenliste</title>
</head>
<body>
<a class="skip-link" href="#main-content">Zum Inhalt</a>
<main id="main-content">
    <section>
        <h1>Themenliste</h1>
        <div sec:authorize="hasAnyRole('BETREUER','STUDIERENDE')">
            <a th:href="@{/mein-profil}">Mein Profil</a>
        </div>
        <form th:action="@{/themen}" method="get" th:object="${sucheForm}">
            <label for="suchbegriff">Suche</label>
            <input id="suchbegriff" type="text" th:field="*{suchbegriff}" />
            <label for="fachgebiet">Fachgebiet</label>
            <input id="fachgebiet" type="text" th:field="*{fachgebiet}" />
            <button type="submit">Anwenden</button>
            <a th:href="@{/themen}">Zuruecksetzen</a>
        </form>
        <div sec:authorize="hasAnyRole('ADMIN','BETREUER','ORGANISATOR')">
            <a th:href="@{/themen/neu}">Neues Thema anlegen</a>
        </div>
        <ul>
            <li th:each="t : ${themen}">
                <a th:href="@{/themen/{id}(id=${t.id})}" th:text="${t.titel}">Thema</a>
            </li>
        </ul>
        <p th:if="${themen == null || #lists.isEmpty(themen)}">Keine Themen vorhanden</p>
    </section>
</main>
</body>
</html>
