<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Themenliste')}">
    <title>Themenliste</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: nav('themen')}"></div>

<main id="main-content" class="container py-4 flex-grow-1">
    <div class="tic-page-header">
        <h1><i class="bi bi-journal-text me-2"></i>Themenliste</h1>
        <div class="tic-actions" sec:authorize="hasAnyRole('ADMIN','BETREUER','ORGANISATOR')">
            <a class="btn btn-primary" th:href="@{/themen/neu}"><i class="bi bi-plus-lg me-1"></i>Neues Thema anlegen</a>
        </div>
    </div>

    <!-- Search -->
    <div class="card border-0 mb-4">
        <div class="card-body">
            <form class="row g-3 align-items-end" th:action="@{/themen}" method="get" th:object="${sucheForm}">
                <div class="col-md-4">
                    <label class="form-label" for="suchbegriff"><i class="bi bi-search me-1"></i>Suche</label>
                    <input id="suchbegriff" type="text" class="form-control" th:field="*{suchbegriff}" placeholder="Titel oder Stichwort..." />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="fachgebiet"><i class="bi bi-tag me-1"></i>Fachgebiet</label>
                    <input id="fachgebiet" type="text" class="form-control" th:field="*{fachgebiet}" placeholder="z.B. Informatik..." />
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-funnel me-1"></i>Filtern</button>
                    <a class="btn btn-outline-secondary" th:href="@{/themen}"><i class="bi bi-arrow-counterclockwise me-1"></i>Zurücksetzen</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Themen List -->
    <div class="card border-0">
        <div class="list-group list-group-flush" th:if="${themen != null && !#lists.isEmpty(themen)}">
            <a th:each="t : ${themen}"
               th:href="@{/themen/{id}(id=${t.id})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span><i class="bi bi-journal-text me-2 text-secondary"></i><span th:text="${t.titel}">Thema</span></span>
                <i class="bi bi-chevron-right text-secondary"></i>
            </a>
        </div>
        <div th:if="${themen == null || #lists.isEmpty(themen)}" class="tic-empty-state">
            <i class="bi bi-journal-x"></i>
            <p>Keine Themen vorhanden</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
