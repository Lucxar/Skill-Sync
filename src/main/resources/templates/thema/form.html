<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <title th:text="${pageTitle}">Thema</title>
</head>
<body>
<a class="skip-link" href="#main-content">Zum Inhalt</a>
<main id="main-content">
    <section>
        <h1 th:text="${pageTitle}">Thema</h1>
        <form th:action="${formAction}" th:object="${themaForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{version}" />
            <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{*}" role="alert" aria-live="polite">Fehler</p>
            <div>
                <label for="titel">Titel</label>
                <input type="text" id="titel" th:field="*{titel}" required
                       th:attr="aria-invalid=${#fields.hasErrors('titel')}, aria-describedby=${#fields.hasErrors('titel')} ? 'titel-error' : null" />
                <p id="titel-error" th:if="${#fields.hasErrors('titel')}" th:errors="*{titel}" role="alert" aria-live="polite">Fehler</p>
            </div>
            <div>
                <label for="beschreibungMarkdown">Beschreibung (optional)</label>
                <textarea id="beschreibungMarkdown" th:field="*{beschreibungMarkdown}" rows="6"></textarea>
            </div>
            <div>
                <label for="fachgebiete">Fachgebiete/Tags (Komma oder Zeilenumbrueche)</label>
                <textarea id="fachgebiete" th:field="*{fachgebiete}" rows="4"></textarea>
            </div>
            <button type="submit" th:text="${submitLabel}">Speichern</button>
        </form>
        <a th:href="@{/themen}">Zurueck zur Liste</a>
    </section>
</main>
</body>
</html>
