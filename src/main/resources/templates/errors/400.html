<!DOCTYPE html>
<html lang="de" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-dark.css}" />
    <title>Ungueltige Anfrage</title>
</head>
<body class="d-flex flex-column min-vh-100">
<a class="skip-link" href="#main-content">Zum Inhalt</a>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/betreuer}"><i class="bi bi-mortarboard-fill"></i> ThesisIsComing</a>
    </div>
</nav>

<main id="main-content" class="container flex-grow-1">
    <div class="tic-error-page">
        <div class="tic-error-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="tic-error-code">400</div>
        <h1 class="h4 mb-3">Ungueltige Anfrage</h1>
        <p th:if="${message}" th:text="${message}">Ungueltige Anfrage.</p>
        <p th:if="${message == null}">Ungueltige Anfrage.</p>
        <a class="btn btn-primary mt-3" th:href="@{/betreuer}"><i class="bi bi-house me-1"></i>Zur Startseite</a>
    </div>
</main>

<footer class="tic-footer">
    <div class="container text-center">
        <small>ThesisIsComing &copy; 2025</small>
    </div>
</footer>
</body>
</html>
