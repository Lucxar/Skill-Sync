<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nicht gefunden')}">
    <title>Nicht gefunden</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav-minimal :: nav-minimal}"></div>

<main id="main-content" class="container flex-grow-1">
    <div class="tic-error-page">
        <div class="tic-error-icon"><i class="bi bi-search"></i></div>
        <div class="tic-error-code">404</div>
        <h1 class="h4 mb-3">Seite nicht gefunden</h1>
        <p th:if="${message}" th:text="${message}">Nicht gefunden.</p>
        <p th:if="${message == null}">Die angeforderte Seite konnte nicht gefunden werden.</p>
        <a class="btn btn-primary mt-3" th:href="@{/betreuer}"><i class="bi bi-house me-1"></i>Zur Startseite</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
